<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="kenward — an assistant for a whole household, on a machine in the house">
  <title>kenward</title>

  <!--
    Sibling of the agentmesh header: same ground, grid, vignette, corner ticks and
    monospace wordmark. Where that one draws a mesh of peers, this draws a household
    in plan — rooms of one's own around a shared hearth. Designed for a dark ground;
    it paints its own, so it drops onto a light page unchanged.
  -->

  <defs>
    <pattern id="kh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    </pattern>
    <radialGradient id="kh-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%"  stop-color="#0A0908" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="kh-firelight" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E8C674" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#E8C674" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#E8C674" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0A0908"/>
  <rect width="1200" height="320" fill="url(#kh-grid)" opacity="0.55"/>
  <rect width="1200" height="320" fill="url(#kh-vignette)"/>

  <!-- frame ticks -->
  <g stroke="#E8E6E1" stroke-width="1.5" fill="none">
    <path d="M40 32 L40 16 L72 16"/>
    <path d="M1160 32 L1160 16 L1128 16"/>
    <path d="M40 288 L40 304 L72 304"/>
    <path d="M1160 288 L1160 304 L1128 304"/>
  </g>

  <!-- meta line -->
  <text x="88" y="22" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#7A7A7A" letter-spacing="2.4">bsl 1.1 · self-hosted · telegram-native</text>

  <!-- wordmark -->
  <text x="40" y="172" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="108" font-weight="800" fill="#E8E6E1" letter-spacing="-4">kenward</text>

  <!-- accent underbar: the hearth, in the wordmark's colour scheme -->
  <rect x="40" y="186" width="120" height="3" fill="#E8C674"/>

  <!-- tagline -->
  <text x="40" y="226" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="19" fill="#D6D4CF" letter-spacing="-0.2">an assistant for a whole household, on a machine in the house.</text>
  <text x="40" y="252" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A8A8A" letter-spacing="0.6">one binary · telegram · ten languages · nothing leaves unless you say so</text>

  <!-- right-side household plan -->
  <g transform="translate(860, 60)">
    <rect x="0" y="0" width="280" height="200" fill="none" stroke="#5A5A5A" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="8" y="-6" font-family="ui-monospace,monospace" font-size="10" fill="#7A7A7A" letter-spacing="1.6">household</text>

    <!-- firelight, under the walls -->
    <circle cx="140" cy="134" r="58" fill="url(#kh-firelight)"/>

    <!-- outer walls, broken by a threshold in the bottom wall -->
    <path d="M126 176 H24 V26 H256 V176 H154"
          fill="none" stroke="#E8E6E1" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- interior walls: three rooms of one's own, open onto the shared room below -->
    <g stroke="#E8E6E1" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <path d="M24 92 H126"/>
      <path d="M154 92 H256"/>
      <path d="M101 26 V92"/>
      <path d="M179 26 V92"/>
    </g>

    <!-- who is in them -->
    <g font-family="ui-monospace,monospace" text-anchor="middle">
      <g font-size="15" font-weight="700" fill="#E8E6E1">
        <text x="62"  y="58">A</text>
        <text x="140" y="58">B</text>
        <text x="218" y="58">C</text>
      </g>
      <g font-size="9" fill="#88BFA8" letter-spacing="1.3">
        <text x="62"  y="76">private</text>
        <text x="140" y="76">private</text>
        <text x="218" y="76">private</text>
      </g>
    </g>

    <!-- the hearth -->
    <rect x="122" y="120" width="36" height="28" rx="2" fill="#E8C674"/>
    <text x="140" y="166" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#E8C674" letter-spacing="1.4">shared</text>
  </g>
</svg>
