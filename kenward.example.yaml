# kenward.example.yaml — a complete, working configuration for a two-member household.
#
# Every key kenward understands appears here, including keys that have a default, so
# this file also documents what exists. Copy it to kenward.yaml, edit the values, and
# export the environment variables it names (never write a secret into this file itself:
# every *_env key names an environment variable, not a token or key value).
#
# This file is exercised by internal/config/example_test.go, which loads it through the
# real Load/Parse path and fails the build if it ever stops parsing and validating
# cleanly. Keep it in sync with internal/config/config.go when the schema changes.
#
# david and jordan share this household, but not this file's privacy posture: david's
# tier chain below never leaves the house, jordan's does. See the comments on
# members[].tiers for why that is the single most important pair of lines in this file.

# mode selects how members' units are run.
#   simple:   one process, one Telegram bot, every member's unit a goroutine in the same
#             address space. Easiest to operate; isolation between members is logical,
#             not enforced — whoever runs this machine can read everyone's private
#             memory. This file configures simple mode.
#   isolated: one pod per member plus one for the group, each with its own bot token,
#             lore instance and key. Nobody, including the operator, can read another
#             member's private memory. Linux only; needs Podman or Docker.
# Getting this wrong is a privacy claim mismatch, not a syntax error: kenward will start
# in whichever mode you name here regardless of what you intended.
mode: simple

# data_dir is where kenward keeps the mutable state it writes about itself. It is not
# where lore's data lives, but it DOES hold secret material and must be treated as such:
#
#   state.json                 enrolment bindings and the personas members wrote
#   sessions.json              each member's WRAPPED KEY
#   invites.json               hashed claim codes not yet redeemed
#   invites/, revocations/     isolated mode's per-member copies of those
#   dashboard/admin.json       the admin account's wrapped key (the password verifier)
#   dashboard/key.pem          the dashboard's TLS private key, under lan exposure
#
# Nothing here is a plaintext secret except that TLS key, but a wrapped key is worth one
# offline guessing campaign to whoever copies it. A BACKUP OF THIS DIRECTORY IS A BACKUP
# OF EVERY MEMBER'S KEY MATERIAL — do not sync it to a shared drive, and keep it 0700.
# docs/IMPLEMENTATION.md §4 lists every file and which ones are sensitive.
#
# Left empty, kenward falls back to a sensible per-OS location (XDG_STATE_HOME on Linux,
# Application Support on macOS, %LOCALAPPDATA% on Windows); set it explicitly here
# because a container deployment's home directory is not where anyone expects state to
# persist, and this is the path the shipped compose files bind-mount.
data_dir: /var/lib/kenward

# household describes the group as a whole: the shared conversation every member can
# read, and the one Telegram group mapped to it.
household:
  # name is a display label only; it appears in doctor output and log lines and has no
  # effect on routing or privacy. Getting it wrong just makes those lines confusing.
  name: "Home"
  # agents is the identity question: one assistant for the household, or one each.
  #   shared:     there is kenward and nothing else. Everyone talks to it, in private
  #               chats and in the group, and household.persona below is therefore
  #               EVERYONE'S persona — there is no personal layer to override it. This
  #               is the default and what kenward has always done.
  #   per_member: every member gets their own named agent for their private chat, and
  #               kenward remains the family agent in the group. Each member's name,
  #               language, tone and character live under members[].persona and are
  #               written by the member themselves in the Telegram tutorial, not here.
  #
  # It is NOT `mode` and must not be reasoned about as though it were. mode is a
  # security question answered by topology; this is a presentation question about who
  # the household is talking to. Under per_member a member has their own bot so that
  # their agent is its own contact — that is a separate CONTACT, not a separate
  # SECRET. Having your own bot is not sealed memory; the mode is what seals it.
  #
  # per_member needs a Telegram bot for each member, because two agents behind one
  # contact are one agent, and only isolated mode gives each member their own. Naming
  # it here in simple mode is a validation error rather than a silent downgrade: the
  # downgrade would resolve every member's private chat to kenward's and quietly take
  # away the assistant they were promised.
  #
  # Under per_member, kenward is also reachable in a private chat, on the household
  # bot. That conversation reads and writes shared_space and nothing else: it is where
  # a member adds something to the household's memory, or asks what is in it, without
  # posting in the group. It never touches their private memory — their own agent is
  # where that lives.
  agents: shared
  # persona is how kenward writes: the language, tone and character of the household's
  # own assistant. Every field's empty value is the behaviour kenward had before this
  # section existed, so a household that deletes this block loses nothing.
  #
  # There is no agent_name here. kenward's name is not configurable — it is the name
  # its documentation, its logs and `kenward doctor` all use — and stating one is a
  # validation error rather than a rename. members[].persona.agent_name is where a
  # member names their own agent, under agents: per_member.
  persona:
    # language is named the way a person names one, not as a code, because it is
    # passed to the model rather than looked up in a table. Empty means English.
    #
    # It reaches two places under two different rules. To THE MODEL it goes verbatim.
    # The node's OWN strings — the onboarding text, the capture announcements and
    # buttons, the refusals, the retrieval line, the locked notice — come from a closed
    # catalogue with ten languages in it: English, Spanish, Catalan, Portuguese,
    # French, Italian, Dutch, German, Chinese and Arabic. Name one of those and the
    # whole conversation is in it. Name anything else and the model still answers in
    # that language while kenward's own machinery stays English.
    #
    # Codes, endonyms and exonyms all match — "es", "espanol", "castellano".
    #
    # It is a setting rather than a default: the assistant answers in this language
    # whatever language a message is written in, because everything else on the screen
    # is already in it and a mirroring reply would be the only part that moved. Asking
    # it outright to switch works, for that conversation.
    #
    # The setup wizard and the four tutorial questions are English and Spanish only.
    # The system prompt and the tool descriptions are English in every case; they are
    # addressed to the model, not to anybody here.
    language: "Spanish"
    # tone is the register, in a phrase. Empty means the flat register docs/PROMPT.md
    # specifies — useful, brief, specific, not a personality — which is the default
    # and remains the default.
    tone: "warm but brief"
    # character is free prose about who this assistant is, up to 1000 characters.
    # Empty — the default — means there is none.
    #
    # It is read by the model as a preference about wording and nothing else: the
    # prompt renders it inside a delimited block, indented so no line of it can reach
    # column zero, and states that it cannot change which memories the assistant can
    # read, what it may propose remembering, or what it must tell you about either.
    character: "Speaks plainly and does not fuss. Knows the house well."
  # shared_space is the lore space the group chat reads from and writes to, and that
  # every member's private space can read but never coincides with. Required: without
  # it the group conversation has nowhere to read or write, and kenward refuses to
  # start rather than silently having no shared memory.
  #
  # It is a lore space ID — the id column of `lore spaces` — and NOT the display name.
  # kenward keys spaces on ids because lore does not enforce unique names, and the check
  # that an entry really lives in the space it claims is worthless if two spaces answer
  # to one name. A display name here is the worst kind of wrong: lore's put accepts it,
  # so writes appear to work, and every read comes back empty. `kenward doctor` catches
  # it and exits 2.
  #
  # Nothing on this path creates a space: the terminal wizard offers the spaces lore
  # already holds — the SHARED ones only, because a lore personal space never crosses
  # accounts and so can hold neither this nor a member's private memory — and stops if
  # there are none. Make it with `lore space create` first. The admin dashboard's
  # first-run wizard is the one thing that does create spaces, for the household and
  # for each member it adds, and it writes their ids here for you.
  shared_space: 7d5047bb-d939-4539-b3db-8b6221a2e245
  # group_chat_id is the Telegram chat id kenward maps to shared_space. It is the
  # negative id Telegram assigns a supergroup, found by adding the bot to the group and
  # checking kenward doctor or the bot API. Zero means no group is configured yet, which
  # is a valid first-run state UNDER agents: shared: no chat resolves to the group scope
  # until this is set, so group messages are simply not served rather than misrouted
  # somewhere else, and kenward still answers every private chat.
  #
  # UNDER agents: per_member IT IS REQUIRED, and both wizards refuse to write a
  # per_member household without one. There, every private chat belongs to that member's
  # own agent and kenward speaks only in the group — the supervisor creates the group's
  # pod only when this is set — so a per_member household with no group chat id has no
  # kenward in it at all, in the group or anywhere.
  #
  # The bot also has to be able to HEAR the group. Telegram turns bot privacy mode on
  # for every new bot, and with it on the bot receives nothing sent in a group: not
  # plain messages, not a reply to it, not an @mention, and nothing is logged because
  # nothing arrives. Send /setprivacy to @BotFather, choose the bot, choose Disable —
  # then remove it from the group and add it again, because Telegram applies the change
  # only to groups the bot joins afterwards. kenward doctor reports this.
  #
  # Disabling it does NOT make kenward answer everything. Every message in the group
  # now arrives here, and kenward rebuilds the gate Telegram stopped applying: it
  # answers only when addressed — an @mention of the bot, a reply to one of its own
  # messages, or a bot command not aimed at another bot by name. A bare "kenward, ..."
  # with no @ is not a mention and is not addressed. Everything else is heard and kept
  # as context for the next question, and costs nothing: no retrieval, no model call,
  # and no capture proposal interrupting a family conversation.
  group_chat_id: -1001234567890
  # tiers is the ordered endpoint tier chain the group conversation may use, tried in
  # the order written until one answers. It must be stated explicitly — see the long
  # comment on members[].tiers below for why an unstated chain is a validation error
  # rather than a permissive default — and every name here must be a tag on at least
  # one endpoint below, or it can only ever be a chain that refuses. This chain reaches
  # every tier this household has: both local machines, then the cloud tier, because a
  # group conversation with several members present is treated as already less private
  # than any one member's own space.
  tiers: [local, local-slow, cloud]

# telegram holds the household-wide bot binding that simple mode uses. Isolated mode
# ignores this block entirely — each member's pod carries its own token instead, named
# by members[].bot_token_env.
telegram:
  # bot_token_env names the environment variable holding the bot token BotFather gave
  # you — never the token itself. Required in simple mode, where this one bot serves
  # the whole household; if it is unset or the variable it names is unset or empty,
  # kenward refuses to start rather than serving a household with no way to receive
  # messages. Get this bound to the wrong token and kenward answers as a bot nobody in
  # the household is talking to.
  #
  # bot_token_file: /run/secrets/household-token is the alternative, and the better
  # one in a container: an environment value is readable by every process in it and is
  # inherited by every child kenward starts. The file's trailing newline is stripped,
  # it must be 0600 (group- or world-readable is refused, on anything but Windows),
  # and naming both this and bot_token_env is an error rather than a precedence. With
  # neither, the systemd credential `bot_token` is used.
  bot_token_env: KENWARD_BOT_TOKEN

# members lists every human in the household. Order here is the order errors are
# reported in; it has no effect on behaviour.
members:
  - # id is the stable internal identifier for this member: what state.json and lore
    # space names key off, and what kenward invite/revoke take as an argument. It must
    # be unique and, in practice, should never be renamed once someone has enrolled —
    # renaming it orphans their binding and their space.
    id: david
    # name is a display label used in prompts, doctor output and onboarding text. Purely
    # cosmetic.
    name: David
    # telegram_id is the numeric Telegram user id bound to this member. It is not
    # something you type in by hand at setup: it is filled in automatically when the
    # member redeems a kenward invite code, and state.json is the source of truth for
    # it thereafter (a value written here is honoured on first run, but if it ever
    # disagrees with what state.json has recorded, kenward refuses to start rather than
    # guessing which one is right). Shown here already-claimed, as a running household
    # looks once every code has been redeemed.
    telegram_id: 100200301
    # private_space is this member's two-member lore space: them and the node, nobody
    # else. Required, must be unique across members, and must never equal
    # household.shared_space — a private space that is the shared space publishes
    # everything the member says to the whole household, silently. A space id from
    # `lore spaces`, not a display name, for the reasons under shared_space above.
    private_space: dac31e70-72e4-4b10-9cef-a6276c4a87b8
    # persona is this member's own, and it is the one block in this file an operator
    # should not be writing on somebody's behalf: it is filled in by the member
    # themselves in the Telegram tutorial after they redeem their invite, and every
    # answer is changeable later. It is shown here because it appears in the file and
    # somebody reading it deserves to know what it is.
    #
    # It applies only under household.agents: per_member. Under shared there is no
    # personal layer, and what is written here is carried and ignored rather than
    # refused — a household that tries one-each and goes back should not have to
    # delete its members' choices by hand before the file will load.
    #
    # Each field falls back to household.persona's, one field at a time rather than
    # all or nothing. A member who wrote a character and said nothing about language
    # keeps the household's language; delete any line below and that is what happens.
    persona:
      # agent_name is what this member's agent calls itself in conversation. It is not
      # the Telegram bot's display name, which is global and set in BotFather — which
      # is why per-member names work however many bots exist.
      agent_name: "Alfred"
      language: "Spanish"
      tone: "very terse"
      character: "Answers in one line where one line will do."
    # tiers is the ordered endpoint tier chain THIS MEMBER'S PRIVATE conversations may
    # use — the single most consequential setting in this file. It is that member's
    # privacy policy, stated as a fact you can read off the page rather than inferred
    # from what happens to be reachable at the time.
    #
    # This chain names only local tags (local, local-slow — both served by machines on
    # the household's own network, see endpoints below). That is what makes "this never
    # leaves the house" true for David: when neither local machine answers, kenward
    # refuses the turn outright instead of quietly widening the chain to reach a cloud
    # endpoint. Compare this to jordan's chain just below, which does name a cloud tier
    # — that asymmetry, one member local-only and one member willing to reach a
    # provider, is the whole point this product is built around, and it is decided per
    # member, right here, not globally.
    #
    # A chain cannot be left empty or omitted: validation treats an unstated chain as an
    # error, never as a default of "use whatever the household uses" or "allow
    # anything" — either of those would silently change what a member was told about
    # their own privacy the moment somebody forgot a line in this file.
    tiers: [local, local-slow]
    # bot_token_env names this member's own bot token variable. It is required, and
    # must be unique per member, in isolated mode only — each member's pod holds its
    # own token there. In simple mode (this file) it is ignored entirely; it is filled
    # in here anyway so the field is documented and so this file is ready to be adapted
    # for isolated mode without hunting for what belongs in it.
    #
    # bot_token_file: /run/secrets/david-token is the alternative, on the same terms as
    # telegram.bot_token_file above: 0600, trailing newline stripped, naming both is an
    # error, and the systemd credential `bot_token.david` covers naming neither. In
    # isolated mode the file paths must be unique per member too — two members reading
    # one token file are two members on one bot.
    bot_token_env: KENWARD_BOT_TOKEN_DAVID
    # passphrase_env names the variable holding the passphrase that wraps THIS MEMBER'S
    # session key. Required in isolated mode, ignored in simple mode (this file), and it
    # must be unique per member for the same reason bot_token_env is: in isolated mode
    # each key is wrapped under its own passphrase, so two members sharing one variable
    # share one wrapping secret — simple mode's key custody with isolated mode's name on
    # it. There is no household-wide passphrase in isolated mode and there is no default;
    # a pod handed none can unwrap nothing and would answer every private message with
    # the locked notice.
    #
    # passphrase_file: /run/secrets/david-passphrase is the alternative, and the better
    # one for a pod: an environment value is readable by every process in the container
    # and is inherited by every child kenward starts, `lore serve` included. Naming
    # both is an error, not a precedence. With neither, the systemd credential
    # `passphrase.david` is used.
    passphrase_env: KENWARD_PASSPHRASE_DAVID
  - id: jordan
    name: Jordan
    telegram_id: 100200302
    private_space: 5f2a9c14-8e0b-4a77-9d31-c6b40e7f2a19
    persona:
      agent_name: "Watson"
      language: "English"
      tone: "friendly"
      character: "Explains its reasoning when the answer is not obvious."
    # jordan's chain reaches the cloud tier after the local ones, so an OpenRouter model
    # answers when neither local machine is awake, instead of the turn being refused.
    # That is a deliberate, opted-into widening of what leaves this house for jordan's
    # private conversations — the opposite choice from david's, made explicitly rather
    # than left to default.
    tiers: [local, cloud]
    bot_token_env: KENWARD_BOT_TOKEN_JORDAN
    passphrase_env: KENWARD_PASSPHRASE_JORDAN

# endpoints lists every OpenAI-compatible backend kenward may route to, and the tier
# tags each one answers for. A tier named in a tiers: chain above but not present as a
# tag on any endpoint here is a chain that can only ever refuse — validation catches
# that rather than letting it fail silently the first time someone actually needs it.
endpoints:
  - # name identifies this endpoint in logs, refusal text and kenward doctor's report,
    # so a member can be told plainly which machine was tried and which answered. Must
    # be unique.
    name: monster
    # base_url is the OpenAI-compatible API root. Must be an absolute http:// or
    # https:// URL with a host; anything else — a bare hostname, a relative path, a
    # scheme kenward cannot speak — is rejected at startup rather than at the moment a
    # member is waiting on a reply.
    base_url: http://monster.tail:8000/v1
    # model is the model name this endpoint's server expects in a completion request.
    # Wrong here means every request to this endpoint fails with the provider's own
    # "model not found", not a kenward error.
    model: qwen3.6-27b-awq
    # api_key_env names the environment variable holding this endpoint's API key.
    # Deliberately left empty here: monster is a machine on the household's own
    # network with no key in front of it, which is the ordinary case for a local
    # endpoint. Leaving this unset is not an oversight — it is what "no authentication
    # needed" looks like, and it is why this key is genuinely absent rather than merely
    # blank in this example.
    tags: [local]
    # tags are the tier names this endpoint answers for; a tiers: chain reaches this
    # endpoint only if it shares at least one tag with the chain.
    # timeout bounds one completion against this endpoint. Left at kenward's own
    # default (120s) — long enough for a local machine to wake from sleep and load a
    # model, which is the normal state for a household box that is not kept always-on.
    # Too short and a slow-but-working machine looks indistinguishable from a dead one.
    timeout: 120s
    # context_window is how many tokens this endpoint holds in one request, prompt and
    # completion together. State the number the server was actually started with —
    # vLLM's --max-model-len, llama.cpp's -c, ollama's num_ctx — not the number the
    # model's card advertises, because the two differ constantly and it is the server
    # that refuses the request. Left out it is 16384, which is deliberately modest:
    # guessing high on an endpoint nobody described turns into a provider error in
    # front of a member, where guessing low only wastes a window.
    context_window: 262144
    # max_completion_tokens caps one reply and is reserved out of context_window, so it
    # must be smaller than it — validation says so at load, naming this endpoint,
    # rather than letting the node fail to start with two numbers and no name.
    #
    # Raised well above the 4096 default here because this endpoint serves a reasoning
    # model, and a reasoning model spends this budget thinking before it writes
    # anything the member will see. Capped too tightly it returns a complete reasoning
    # trace, no content at all, and a perfectly healthy "stop" — which the member
    # experiences as an assistant that has quietly stopped working.
    max_completion_tokens: 32768
  - name: battlestation
    base_url: http://battlestation.tail:8000/v1
    model: llama-3.1-8b-instruct-awq
    # Also no api_key_env: a second machine on the same household network, same
    # reasoning as monster above.
    tags: [local-slow]
    timeout: 120s
    # Smaller than monster's, and it is this number rather than monster's that decides
    # what david's conversations get: his chain is [local, local-slow], the router
    # picks an endpoint only after the prompt has been assembled, so the prompt has to
    # fit the smallest machine the chain can reach. Two endpoints with very different
    # windows in one chain means the larger one is never used to its size — which is
    # the argument for keeping them in different tiers, not the same one.
    context_window: 32768
    max_completion_tokens: 4096
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-5
    # Unlike the two local machines, a cloud provider requires a key, and OPENROUTER_API_KEY
    # must be exported and non-empty or kenward refuses to start — a missing provider key
    # discovered mid-turn is a refusal a member cannot act on, so it is caught here instead.
    #
    # api_key_file: /run/secrets/openrouter is the alternative, on the same terms as the
    # bot token files above: 0600, trailing newline stripped, naming both is an error,
    # and the systemd credential `api_key.openrouter` covers naming neither. An endpoint
    # that names no source at all is the local case — no authentication needed — and is
    # not an error.
    api_key_env: OPENROUTER_API_KEY
    tags: [cloud]
    # Given an explicit, shorter timeout than the local machines: a cloud endpoint that
    # has not answered in 90s is almost certainly not going to, where a local machine
    # might still be booting.
    timeout: 90s
    # A hosted provider's window, and a cap sized for an ordinary instruct model rather
    # than a thinking one. Note what this does to the household's own chain, which is
    # [local, local-slow, cloud]: the group conversation is budgeted at battlestation's
    # 32768, the smallest of the three, even though two of its endpoints are far larger.
    context_window: 200000
    max_completion_tokens: 8192

# memory configures the lore client every unit uses for retrieval and capture.
memory:
  # lore_command locates the lore executable. kenward opens the store itself, in
  # process, through lore's Go API — this names the binary for one other thing: the
  # sync daemon (`lore serve`) an isolated pod runs so its copy of the household's
  # shared space reaches the other pods. Only the first element is read. Trailing
  # elements are accepted and ignored, so a configuration written when kenward
  # spawned `lore mcp` still loads unchanged.
  #
  # Naming it is worth the line on a machine where `lore` is not on PATH: in simple
  # mode nothing needs it and it is inert, but in isolated mode a missing binary is
  # a household whose shared memory silently stops converging.
  lore_command: ["lore"]
  # search_limit is the per-space retrieval budget for one turn: how many entries lore
  # may return from each space in scope before assembly stops asking. Kenward's default
  # is 8; set explicitly here to the same value. Too high and prompts bloat with
  # marginal context; too low and relevant entries silently never surface.
  search_limit: 8
  # announce_reads prefixes each reply with a line naming the memories that were
  # searched and how many entries reached the answer, in the conversation's own
  # language, italicised behind a magnifying glass:
  #
  #     🔍 searched your private memory (2 entries), the household memory (nothing)
  #
  # Kenward's default is true; set explicitly here to the same value.
  #
  # This one is a setting because a read changes nothing: a household that finds the
  # line noisy turns it off and loses nothing but the line. The announcement kenward
  # makes when it *writes* something is not a setting, and there is deliberately no
  # key here for it — see capture.private_writes below.
  announce_reads: true

# history is the other thing kenward holds, and it is the opposite of memory above.
# lore is what the household decided to keep: permanent, written only when somebody
# agrees to it. This is the last handful of turns of each conversation, kept in RAM so
# the assistant can follow a thread, never written to lore, and already gone whenever
# kenward restarts.
history:
  # reset_every drops those recent turns on a schedule, so a conversation does not
  # carry last Tuesday's tangent into this morning. Kenward's default is 0s — off —
  # and that is what is set here: an existing household's assistant keeps behaving
  # exactly as it did until somebody asks for this.
  #
  # Times are anchored to local midnight, so 6h means midnight, 06:00, noon and 18:00,
  # and 24h means midnight. 24h is the longest value accepted; anything longer would
  # collapse to one reset per midnight, and a file claiming otherwise is refused
  # rather than quietly reinterpreted.
  #
  # The reset happens on the first message after a boundary passes, not on a timer.
  # Nobody is interrupted between their question and its answer by a clock, a
  # conversation nobody is having is not "cleared" in a way no one could observe, and
  # a household asleep at 04:00 finds it already done at breakfast. Whoever is talking
  # is told, in one line, whenever a reset actually drops something — kenward does not
  # quietly change what it appears to know.
  #
  # This is not session.idle_timeout below, though both are durations and both are off
  # by default. That one expires a member's key and stops their assistant answering at
  # all until somebody unlocks it at the machine. This one costs the thread of a
  # conversation, and the next message works normally.
  reset_every: 0s

# session configures how long an unlocked key stays usable without activity.
session:
  # idle_timeout is how long an unlocked session key stays in memory after the last
  # message before it is zeroed. Kenward's default is 0s — off — and that is what is
  # set here, because there is no way for a member to unlock again from Telegram: a
  # passphrase never travels over the chat. Turning this on therefore does not shorten
  # a key's life at the cost of one extra prompt, it stops that member's assistant
  # answering after a quiet afternoon, until somebody starts it again at the machine.
  # Set a duration only if that is a trade you want: the key leaves memory sooner, and
  # nothing gets it back in without physical access.
  idle_timeout: 0s

  # passphrase_env names the variable holding the one node passphrase that wraps every
  # member's key in simple mode. It is optional, and naming it here is the reason to:
  # a passphrase can also arrive as a systemd credential (kenward-passphrase), as the
  # KENWARD_PASSPHRASE variable with nothing said about it here, or typed at a terminal,
  # and all three still work — but only a named source is checked when the file loads.
  # Unnamed, a missing passphrase is discovered further in, where a container has
  # nothing to do but exit 2 and be restarted forever; named, it is one line at startup
  # saying which variable is not set, which is what a member's passphrase_env already
  # gave isolated mode.
  #
  # Name it only if this is really how the passphrase arrives. A file that names a
  # variable the deployment does not set is refused, so a systemd install using
  # LoadCredential=kenward-passphrase should leave both of these out.
  #
  # passphrase_file: /run/secrets/kenward-passphrase is the better form in a container,
  # where an environment variable is readable by every process in it and is inherited
  # by every child kenward starts, `lore serve` included. One source only: naming both
  # is an error.
  passphrase_env: KENWARD_PASSPHRASE

# capture governs how memory writes reach the member.
capture:
  # max_proposals_per_turn caps capture proposals per turn. Kenward's default is 1, set
  # explicitly here to the same value: an assistant that interrupts about memory more
  # than once per turn trains members to ignore it on reflex, which defeats capture
  # entirely rather than merely annoying someone.
  max_proposals_per_turn: 1
  # private_writes says what happens when the assistant has something to record in a
  # member's own private memory.
  #
  #   save: write it, then show the member exactly what was written and where, with an
  #         Undo button live for a few minutes. Kenward's default, set explicitly here.
  #   ask:  put it as a question first and write nothing until they tap. This is what
  #         kenward did before, and a household that preferred it has it back.
  #
  # Two things this key does NOT control, deliberately, because neither has a setting:
  #
  #   - Anything going to the household's shared memory is always asked about first,
  #     under either policy. Publishing to everyone is the one act here that cannot be
  #     taken back, so it is never done on the assistant's own initiative.
  #   - The member is always told when something was written. If a write could be
  #     silent, "kenward never records anything without telling you" would stop being
  #     true, and there would be no honest way left to describe the product.
  private_writes: save

# update configures kenward's self-update behaviour.
update:
  # channel selects which releases this node applies.
  #   stable: released versions only (kenward's default).
  #   edge:   pre-releases too.
  #   off:    never updates — a fully supported way to run kenward forever without ever
  #           taking a new version. Getting this wrong on the stable/edge side risks
  #           taking an unstable build unintentionally; there is no wrong answer on off.
  channel: stable
  # check_interval is how often the node looks for a new release. Kenward's default is
  # 6 hours, set explicitly here to the same value. Ignored entirely when channel is
  # off. Too frequent wastes a request against the release feed for no benefit, since
  # kenward never applies more than one release at a time regardless of how often it
  # looks.
  check_interval: 6h

# reminders bounds the one thing kenward does without being asked.
#
# Every other message this node sends is a reply to one a member sent. A reminder is
# not, and that makes this block the household's only control over a capability it
# cannot otherwise refuse. Two things it does NOT do, deliberately:
#
#   - A reminder never reaches a model. When it comes due, the text the member asked
#     for is sent, exactly as written — nothing is generated, no memory is searched,
#     and no provider is contacted. The code has no way to do otherwise: the clock is
#     built without a router. So a schedule cannot run up a bill overnight, and the
#     privacy claim about tier chains is untouched by anything in this block.
#   - It does not decide who may set one. Any member can, in their own chat, by asking;
#     what they set is theirs and is delivered to them. A reminder set in the household
#     group belongs to the group and arrives there.
reminders:
  # timezone is the household's clock, as an IANA name. Members say "half seven" and
  # mean their own clock, not the node's. Leave it empty for the machine's own zone,
  # which is right when the node sits in the house it serves; name one when it does
  # not, or when the machine's zone is not something anyone chose.
  timezone: Europe/Madrid

  # max_per_day caps how many unprompted messages ONE conversation may receive in a
  # day, counted in the timezone above. Kenward's default is 6, set explicitly here to
  # the same value: enough for a morning routine and a few one-offs, few enough that
  # nobody reaches for the mute button — and a muted assistant is a dead one.
  #
  # A negative number turns delivery off entirely. Reminders can still be set and are
  # still listed by `kenward doctor`; none is ever sent. That exists so a household can
  # go quiet without every member having to cancel their own.
  #
  # Reaching the cap is not announced. Saying so would itself be an unprompted message,
  # sent to report that too many unprompted messages had been sent. It appears in the
  # log and in `kenward doctor`, where the person who can change this number is looking.
  max_per_day: 6

  # catch_up_window is how late a REPEATING reminder may be and still be delivered
  # after the node has been off. Kenward's default is 6 hours, set explicitly here.
  #
  # Household machines are legitimately asleep, so this is the ordinary case rather
  # than an edge one, and the two kinds of reminder get different answers:
  #
  #   repeating: however many occurrences were missed, at most ONE is delivered, and it
  #              is the most recent one — a node off overnight owes the household one
  #              bin reminder, not sixteen. If even that one is older than this window
  #              it is skipped silently, because a stale routine is worthless.
  #   one-off:   delivered however late it is, and this window does not apply. There is
  #              exactly one of it ever, so it cannot flood anything, and it is a
  #              promise to a person: dropping it silently is the only outcome that
  #              leaves somebody trusting a reminder that never came. A late one says
  #              when it was due.
  catch_up_window: 6h

  # max_stored caps how many reminders one conversation may hold at once. Kenward's
  # default is 20, set explicitly here. It is what stops a model that has discovered
  # the tool from filling a member's list; the member is told plainly when it is full.
  max_stored: 20

# dashboard configures the admin dashboard: one HTTP server, one account, and no port
# opened at all unless this block says otherwise.
#
# Leaving the whole block out is the same as enabled: false, and that is what every
# configuration written before the dashboard existed means. It is spelled out here
# because a household that does not know the dashboard exists cannot decide it does not
# want one.
dashboard:
  # enabled turns the listener on. Off, `kenward run` opens no socket at all. `kenward
  # dashboard` runs one anyway — that command exists so a first run is reachable on a
  # machine with no configuration on it — but this key is what decides whether the node
  # itself serves it.
  enabled: true
  # bind is the host:port the listener takes. The default is 127.0.0.1:8770, and this
  # example states it rather than relying on it because it is the line somebody reads
  # when they want to know whether anything off this machine can reach the box.
  bind: 127.0.0.1:8770
  # exposure is what the household was told, and it is checked against bind rather than
  # derived from it. One of loopback, tailnet or lan.
  #
  #   loopback: this machine only. The default, and the only one that needs no further
  #             decision. A bind that is not a loopback address under this exposure is a
  #             refusal to start rather than a warning: a household told its dashboard
  #             is unreachable while it listens on every interface is a household with
  #             an admin login on the network and no idea.
  #   tailnet:  one interface of a tailnet or VPN, and the recommended way in from
  #             another machine. The network underneath has already authenticated and
  #             encrypted the connection before kenward sees it, which is a stronger
  #             guarantee than a certificate this machine signed for itself.
  #   lan:      the household's own network, where nothing has. It requires TLS and
  #             validation refuses it without: a LAN is not a trust boundary, and the
  #             password that unlocks every member's private memory is the one thing
  #             that must not cross one in the clear.
  #
  # Exposure is chosen in the dashboard itself, under Access, after the admin account
  # exists — never before, and never during first-run setup, which always happens on
  # loopback because there is no account to protect that page with yet.
  exposure: loopback
  # tls_cert_file and tls_key_file are the PEM pair the listener serves HTTPS from.
  # Absent here, because this is a loopback dashboard and needs none.
  #
  # They are not normally written by hand. Choosing lan exposure in the dashboard
  # generates a self-signed pair under the data directory, writes these two keys, and
  # shows the certificate's SHA-256 fingerprint once so it can be checked against the
  # browser's own warning — which is the entire ceremony that makes a self-signed
  # certificate worth anything. Stating one without the other is a validation error.
  #
  # tls_cert_file: /var/lib/kenward/dashboard/cert.pem
  # tls_key_file: /var/lib/kenward/dashboard/key.pem
