version: '3'

vars:
  MODULE: github.com/BlueHeisenberg/kenward
  VERSION_PKG: '{{.MODULE}}/internal/version'
  # Falls back to the short commit hash when the repo has no tags.
  GIT_VERSION:
    sh: git describe --tags --always --dirty
  GIT_COMMIT:
    sh: git rev-parse --short HEAD
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -X '{{.VERSION_PKG}}.Version={{.GIT_VERSION}}'
    -X '{{.VERSION_PKG}}.Commit={{.GIT_COMMIT}}'
    -X '{{.VERSION_PKG}}.Date={{.BUILD_DATE}}'
  # Every platform a release carries. Must stay in step with
  # .goreleaser.yaml's build matrix and with defaultPlatforms in
  # cmd/kenward-release/manifest.go: a platform built but not listed there is
  # a platform whose installations quietly never update.
  CROSS_TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64

tasks:
  default:
    desc: Lint then test.
    cmds:
      - task: lint
      - task: test

  build:
    desc: Build the kenward binary into ./bin, with version metadata injected via -ldflags.
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o ./bin/kenward ./cmd/kenward

  test:
    desc: Run the test suite.
    cmds:
      - go test ./...

  test:race:
    desc: Run the test suite with the race detector enabled.
    cmds:
      - go test -race ./...

  lint:
    desc: Check gofmt and go vet cleanliness.
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          echo "gofmt: the above files are not formatted" >&2
          exit 1
        fi
      - go vet ./...

  tidy:
    desc: Tidy go.mod and go.sum.
    cmds:
      - go mod tidy

  snapshot:
    desc: Rehearse the whole release — binaries, archives, deb, rpm, cask — publishing nothing.
    cmds:
      - GOWORK=off goreleaser release --snapshot --clean --skip=publish

  release:check:
    desc: Validate .goreleaser.yaml.
    cmds:
      - goreleaser check

  install:test:
    desc: Exercise install.sh end to end in a throwaway container. Needs Docker.
    cmds:
      - mkdir -p ./dist/release
      # Only the one platform the container runs; the point of the exercise is
      # install.sh's branching, not the cross-compiler.
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 GOWORK=off go build -ldflags "{{.LDFLAGS}}" -o ./dist/release/kenward_linux_amd64 ./cmd/kenward
      # The unit ships as a release asset and is checksummed like the binary —
      # it is installed as root, so install.sh must be able to check it.
      # .goreleaser.yaml does the same thing for a real release.
      - cp deploy/kenward.service ./dist/release/kenward.service
      - (cd ./dist/release && sha256sum kenward_linux_amd64 kenward.service > checksums.txt)
      - >-
        docker run --rm
        -v "$PWD:/mnt:ro" -v "$PWD/dist/release:/release:ro"
        debian:bookworm-slim sh /mnt/install_test.sh

  cross:
    desc: Cross-compile release binaries into ./dist for all supported platforms.
    cmds:
      - mkdir -p ./dist
      - |
        for target in {{.CROSS_TARGETS}}; do
          os="${target%/*}"
          arch="${target#*/}"
          ext=""
          if [ "$os" = "windows" ]; then ext=".exe"; fi
          out="./dist/kenward_${os}_${arch}${ext}"
          echo "building $out"
          GOOS="$os" GOARCH="$arch" go build -ldflags "{{.LDFLAGS}}" -o "$out" ./cmd/kenward
        done
