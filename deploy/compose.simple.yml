# kenward — Simple mode (docs/README.md's "Two modes, one binary" table).
#
# One process, one container, one household Telegram bot. Separation between
# members is real (separate lore spaces); sealing against whoever runs this
# machine is not — that operator can read anyone's private memory. That is
# Simple mode's stated, honest limitation, not a bug. If your household needs
# to seal private memory against the machine's owner, use
# compose.isolated.yml instead.
#
# Before running:
#   1. Run a wizard to write kenward.yaml, AND POINT IT AT ./kenward-data, the
#      directory this file mounts:
#
#        mkdir -p ./kenward-data
#        LORE_HOME="$PWD/kenward-data/lore" \
#          kenward setup --data-dir ./kenward-data      # or the dashboard wizard
#
#      Both values matter and the first one is the whole of this step. The
#      wizard CREATES this household's lore spaces and writes their ids into
#      kenward.yaml — `household.shared_space`, each member's `private_space` —
#      and nothing anywhere can create a space at an id that was chosen
#      elsewhere. So the store the wizard made them in has to be the store this
#      container opens. Point it somewhere else and every id in the file names a
#      space this container will never hold: see WHY IT IS NOT A NAMED VOLUME
#      below, which is the bug this instruction exists to prevent.
#
#      The data directory is the same story with a shorter reason. Claim codes,
#      wrapped keys and the dashboard's admin account also live there, so a
#      wizard writing to one directory and a container reading another loses the
#      first member's claim code and the admin password with it.
#
#   2. Create a `.env` file next to this compose file — also NOT committed,
#      see deploy/README.md — defining KENWARD_BOT_TOKEN, KENWARD_PASSPHRASE,
#      and one variable per `api_key_env` referenced by an endpoint in
#      kenward.yaml.
#
#   3. Give the directory to the container's user:
#
#        sudo chown -R 65532:65532 ./kenward-data
#
#      This image runs as the fixed non-root uid 65532 (see the Dockerfile), and
#      the wizard above ran as you. Without this the container cannot write its
#      own store and refuses to start. It is one command, once; everything the
#      container writes afterwards is already that uid's. (Rootless podman maps
#      the container's 65532 into your own subuid range instead — there,
#      `podman unshare chown -R 65532:65532 ./kenward-data`.)
#
# THERE IS NO FOURTH STEP, AND THERE IS NO LORE BINARY IN THIS FILE.
#
# There used to be two more: bind-mount a `lore` built for this image's
# architecture, then `docker compose run --entrypoint /usr/local/bin/lore` twice
# to initialise the volume's store and create a space, then copy an id out of
# `lore spaces` into kenward.yaml. All of it is gone. kenward opens its store in
# this process through lore's Go API and creates it the first time the container
# starts, and the spaces kenward.yaml names were made by whichever wizard wrote
# that file — `kenward setup` or the dashboard.
#
# WHY IT IS NOT A NAMED VOLUME, WHICH IS WHAT THIS FILE USED TO SAY.
#
# It said steps 1 and 2 and then "THERE IS NO THIRD STEP", and it mounted
# `kenward-data:/var/lib/kenward` — a fresh named volume no host wizard has ever
# touched — with LORE_HOME inside it. Following it exactly produced a container
# that came up, created an empty store of its own, and held none of the spaces
# in the kenward.yaml it had just been handed:
#
#   kenward   unhealthy   (FailingStreak 5, exit codes 2 2 2 2 2)
#   ✓ lore answers
#   ✗ space "a8d426cf-…" is not a space this lore store holds
#
# The claim that there was no third step was true of the LORE BINARY, which is
# genuinely gone, and false of the STORE, which had quietly moved from something
# the operator initialised by hand to something the container initialised for
# itself — in the wrong place. Two directories, one of them empty, and nothing
# saying which was which. A bind mount is what makes the wizard's store and the
# container's store the same store, and it costs simple mode nothing that it had:
# this mode's stated limitation is already that whoever runs the machine can read
# anyone's private memory, so a directory beside the compose file gives away
# exactly nothing that a named volume on the same host was keeping.
#
# (Isolated mode is the opposite case and keeps its per-pod NAMED volumes for
# that reason — there, a member's store on a host path the operator can read
# would defeat the mode. See compose.isolated.yml.)
#
# compose.isolated.yml has one operator step this file does not, and it is not a
# binary to supply either — the image carries the lore CLI. It is the membership
# handshake: each pod there has its own store, and one space is made to span them
# by `lore space invite` in one pod and `lore join` in the others, which lore
# exposes no Go API for. Simple mode has one store holding every space, nothing to
# converge with and nobody to invite, so it needs none of it.
#
# Secrets never appear in this file: every token/key is named by environment
# variable only, sourced from `.env`, exactly as kenward.yaml itself only ever
# names an env var (`bot_token_env`, `api_key_env`) and never a literal value.
#
# THE BIND MOUNT BELOW CARRIES `z`, AND THAT IS AN SELINUX REQUIREMENT, NOT A
# STYLE CHOICE. On a host running SELinux in enforcing mode — Fedora, RHEL,
# CentOS Stream, where rootless podman is most at home — a bind-mounted host
# file keeps its own label and a container process (`container_t`) may not read
# it, so the mount would be denied and this container would exit on a
# permission error that names no cause. `z` relabels the source so the container
# may read it. It is a no-op wherever SELinux is not enforcing (Docker Desktop,
# Ubuntu and every other AppArmor host parse the option and skip the relabel).
#
# `z` (shared) rather than `Z` (private to one container) deliberately: this
# kenward.yaml is not one container's — compose.isolated.yml in this directory
# mounts the same file into three more. `Z` would relabel it to whichever
# container was started last and the others would lose access. Nothing is given
# away by that: this configuration names secrets and holds none. ./kenward-data
# carries `z` too, for the narrower reason in its own comment below.
#
# NO `env_file:` HERE either — do not add it back. Unlike compose.isolated.yml,
# this is not a privacy boundary: Simple mode is one process behind one bot
# token by design, so there is no second member's token for a stray `env_file:`
# to leak. The reason to avoid it is narrower but still real: `env_file:` pulls
# in every variable that happens to sit in `.env` — including keys for
# providers this household's kenward.yaml never references, or secrets left
# over from something else sharing the file — and hands all of it to this
# process. Listing only the variables kenward.yaml actually names keeps that
# surface to what is in use.

services:
  kenward:
    # Swap for `build: { context: .. }` to build from source instead of a
    # published tag.
    image: ghcr.io/blueheisenberg/kenward:latest
    container_name: kenward
    restart: unless-stopped

    environment:
      # Must match telegram.bot_token_env in kenward.yaml. Interpolated from
      # `.env` at compose parse time — not injected wholesale.
      KENWARD_BOT_TOKEN: ${KENWARD_BOT_TOKEN}
      # The one node passphrase that wraps every member's key in simple mode.
      # Not optional and not defaultable: without it kenward refuses to start
      # and this container restart-loops on exit 2 forever, because the ways to
      # supply one are a source named in kenward.yaml, a systemd credential (no
      # systemd here), this variable, and a terminal prompt (nothing is attached
      # to answer it). kenward.service's LoadCredential=kenward-passphrase is
      # the same secret by the better mechanism; a container has no portable
      # equivalent, so it arrives here as an environment variable — see
      # deploy/README.md.
      #
      # NAME IT IN kenward.yaml, not just here:
      #
      #   session:
      #     passphrase_env: KENWARD_PASSPHRASE
      #
      # The variable alone works, but nothing checks for it until the session
      # manager is built, and what an operator sees then is a general refusal
      # listing every mechanism rather than "KENWARD_PASSPHRASE is not set".
      # Named in the file, an empty or missing value is one line at load with
      # the variable in it — the same quality of message a member's
      # passphrase_env already gives isolated mode, and the reason this file
      # once shipped with no passphrase at all and crash-looped.
      #
      # Lose or change this value and no member's key unwraps again: it is the
      # wrapping secret for everything under kenward-data, not a login.
      #
      # A file is better than this variable if you can manage one, because an
      # environment variable is readable by every process in the container and
      # visible in /proc. Two ways to do that, and pick exactly one:
      #
      #   1. kenward.yaml's own `session: passphrase_file: /run/secrets/…`,
      #      mounted read-only at 0600. Drop the line below and the
      #      passphrase_env above; naming both sources is a validation error.
      #   2. The systemd credential path, which works here too: set
      #      CREDENTIALS_DIRECTORY and mount the secret at that path as
      #      `kenward-passphrase`. Drop the line below and name NOTHING in
      #      kenward.yaml — a named source the deployment does not supply is
      #      itself a refusal.
      #
      #        environment:
      #          CREDENTIALS_DIRECTORY: /run/secrets
      #        volumes:
      #          - ./kenward-passphrase:/run/secrets/kenward-passphrase:ro,Z
      #
      # kenward reports which one it used at startup — `source=…` on the
      # sessions line — which is how you check.
      KENWARD_PASSPHRASE: ${KENWARD_PASSPHRASE}
      # Where this container's lore store lives. kenward opens it in process, so
      # this is the store the household actually remembers into. It must be under
      # the data directory below and it must be stated: unset, lore falls back to
      # $HOME/.lore — /home/nonroot/.lore in this image — which is on the
      # read_only root filesystem, so the store cannot be created and kenward
      # refuses to serve rather than running on with no memory. Same variable and
      # same path as every service in compose.isolated.yml, for the same reason.
      #
      # /var/lib/kenward is ./kenward-data on the host, so this resolves to
      # ./kenward-data/lore — the store step 1 told the wizard to create the
      # household's spaces in. That is not a coincidence to be tidied away: the
      # two have to be the same store or the ids in kenward.yaml name nothing.
      LORE_HOME: /var/lib/kenward/lore
      # Add one line here (and in .env) per api_key_env your endpoints
      # reference, e.g.:
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

    volumes:
      - ./kenward.yaml:/etc/kenward/kenward.yaml:ro,z
      # The household's whole state: the lore store, the wrapped keys, the
      # outstanding claim codes, the dashboard's admin account. A HOST DIRECTORY
      # and not a named volume, deliberately — see "WHY IT IS NOT A NAMED VOLUME"
      # in the header. It is the directory step 1 pointed the wizard at, and
      # step 3 chowned to 65532.
      #
      # `z` and not `Z` for the same reason kenward.yaml carries `z`: a
      # `docker compose run` against this service would otherwise relabel the
      # household's store to a throwaway container's categories and the running
      # one would lose access to its own memory.
      - ./kenward-data:/var/lib/kenward:z
      # No lore binary. Simple mode executes none; see the header.

    # Declared here as well as in the image, and it is not a duplicate: the
    # image's HEALTHCHECK instruction is Docker-format only, and `podman build`
    # defaults to OCI, where it is dropped with the warning "HEALTHCHECK is not
    # supported for OCI image format and will be ignored". Podman is one of the
    # two runtimes this deployment supports, so the check that actually runs is
    # the one written here. Same command, same intervals — `doctor` exits 0 when
    # the config loads, lore answers and Telegram authorises, and deliberately
    # does NOT probe any routing endpoint: a household GPU box is legitimately
    # switched off, and treating that as unhealthy restarts a healthy container
    # in a loop.
    #
    # UNHEALTHY MEANS "kenward would refuse to start on this", exactly, and that
    # is the rule the whole exit code follows (cmd/kenward's judgeMemory, which
    # `run` and `doctor` share). It has to: an unhealthy container gets
    # restarted, so a condition the node happily starts through can only produce
    # a loop that fixes nothing. A store holding NONE of the configured spaces —
    # the state the old named volume produced — is unhealthy and `run` refuses
    # it. One mistyped space id among several is a `!` line on the report and the
    # household stays up.
    healthcheck:
      test: ["CMD", "/usr/local/bin/kenward", "doctor",
             "--config", "/etc/kenward/kenward.yaml",
             "--data-dir", "/var/lib/kenward"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Writable scratch space only; the data directory is the one place
      # kenward actually persists anything.
      - /tmp
    cap_drop:
      - ALL
