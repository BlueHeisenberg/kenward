# kenward — Simple mode (docs/README.md's "Two modes, one binary" table).
#
# One process, one container, one household Telegram bot. Separation between
# members is real (separate lore spaces); sealing against whoever runs this
# machine is not — that operator can read anyone's private memory. That is
# Simple mode's stated, honest limitation, not a bug. If your household needs
# to seal private memory against the machine's owner, use
# compose.isolated.yml instead.
#
# Before running:
#   1. Write kenward.yaml next to this file (mode: simple) — see
#      docs/IMPLEMENTATION.md §4 for the schema. Do NOT commit it.
#   2. Create a `.env` file next to this compose file — also NOT committed,
#      see deploy/README.md — defining KENWARD_BOT_TOKEN, KENWARD_PASSPHRASE,
#      and one variable per `api_key_env` referenced by an endpoint in
#      kenward.yaml.
#   3. Nothing to supply. The image carries the lore CLI at /usr/local/bin/lore,
#      which is what the one-off commands in step 4 run; there is no binary to
#      build and no bind mount for one. kenward itself reaches the store as a Go
#      library and executes nothing. See the note at the top of ../Dockerfile.
#   4. Initialise that lore store ONCE, and create the spaces kenward.yaml
#      names, against the same LORE_HOME the service below sets:
#
#        docker compose -f compose.simple.yml run --rm \
#          --entrypoint /usr/local/bin/lore kenward init --name kenward
#        docker compose -f compose.simple.yml run --rm \
#          --entrypoint /usr/local/bin/lore kenward space create home
#
#      then put the id `lore spaces` prints into household.shared_space and
#      each member's private_space. A store with no account in it cannot be
#      opened, and kenward will not serve without memory: `run` opens the store
#      and searches it once before anything else, so this container exits 1
#      saying the store was never initialised rather than running with no
#      memory.
#      Store the recovery code `init` prints; nothing else can recover this
#      store.
#
# Secrets never appear in this file: every token/key is named by environment
# variable only, sourced from `.env`, exactly as kenward.yaml itself only ever
# names an env var (`bot_token_env`, `api_key_env`) and never a literal value.
#
# BOTH BIND MOUNTS BELOW CARRY `z`, AND THAT IS AN SELINUX REQUIREMENT, NOT A
# STYLE CHOICE. On a host running SELinux in enforcing mode — Fedora, RHEL,
# CentOS Stream, where rootless podman is most at home — a bind-mounted host
# file keeps its own label and a container process (`container_t`) may not read
# it, so both mounts would be denied and this container would exit on a
# permission error that names no cause. `z` relabels the source so the container
# may read it. It is a no-op wherever SELinux is not enforcing (Docker Desktop,
# Ubuntu and every other AppArmor host parse the option and skip the relabel).
#
# `z` (shared) rather than `Z` (private to one container) deliberately, for both:
# neither file is one container's — the `docker compose run` steps above start a
# second container against the same two paths, and compose.isolated.yml in this
# directory mounts them into three more. `Z` would relabel them to whichever
# container was started last and the others would lose access. Nothing is given
# away by that: this configuration names secrets and holds none, and `lore` is a
# binary. The named volume needs nothing — the runtime labels that itself.
#
# NO `env_file:` HERE either — do not add it back. Unlike compose.isolated.yml,
# this is not a privacy boundary: Simple mode is one process behind one bot
# token by design, so there is no second member's token for a stray `env_file:`
# to leak. The reason to avoid it is narrower but still real: `env_file:` pulls
# in every variable that happens to sit in `.env` — including keys for
# providers this household's kenward.yaml never references, or secrets left
# over from something else sharing the file — and hands all of it to this
# process, and to any `lore serve` it starts. Listing only the variables
# kenward.yaml actually names keeps that surface to what is in use.

services:
  kenward:
    # Swap for `build: { context: .. }` to build from source instead of a
    # published tag.
    image: ghcr.io/blueheisenberg/kenward:latest
    container_name: kenward
    restart: unless-stopped

    environment:
      # Must match telegram.bot_token_env in kenward.yaml. Interpolated from
      # `.env` at compose parse time — not injected wholesale.
      KENWARD_BOT_TOKEN: ${KENWARD_BOT_TOKEN}
      # The one node passphrase that wraps every member's key in simple mode.
      # Not optional and not defaultable: without it kenward refuses to start
      # and this container restart-loops on exit 2 forever, because the ways to
      # supply one are a source named in kenward.yaml, a systemd credential (no
      # systemd here), this variable, and a terminal prompt (nothing is attached
      # to answer it). kenward.service's LoadCredential=kenward-passphrase is
      # the same secret by the better mechanism; a container has no portable
      # equivalent, so it arrives here as an environment variable — see
      # deploy/README.md.
      #
      # NAME IT IN kenward.yaml, not just here:
      #
      #   session:
      #     passphrase_env: KENWARD_PASSPHRASE
      #
      # The variable alone works, but nothing checks for it until the session
      # manager is built, and what an operator sees then is a general refusal
      # listing every mechanism rather than "KENWARD_PASSPHRASE is not set".
      # Named in the file, an empty or missing value is one line at load with
      # the variable in it — the same quality of message a member's
      # passphrase_env already gives isolated mode, and the reason this file
      # once shipped with no passphrase at all and crash-looped.
      #
      # Lose or change this value and no member's key unwraps again: it is the
      # wrapping secret for everything under kenward-data, not a login.
      #
      # A file is better than this variable if you can manage one, because an
      # environment variable is inherited by every child process kenward starts,
      # `lore serve` included. Two ways to do that, and pick exactly one:
      #
      #   1. kenward.yaml's own `session: passphrase_file: /run/secrets/…`,
      #      mounted read-only at 0600. Drop the line below and the
      #      passphrase_env above; naming both sources is a validation error.
      #   2. The systemd credential path, which works here too: set
      #      CREDENTIALS_DIRECTORY and mount the secret at that path as
      #      `kenward-passphrase`. Drop the line below and name NOTHING in
      #      kenward.yaml — a named source the deployment does not supply is
      #      itself a refusal.
      #
      #        environment:
      #          CREDENTIALS_DIRECTORY: /run/secrets
      #        volumes:
      #          - ./kenward-passphrase:/run/secrets/kenward-passphrase:ro,Z
      #
      # kenward reports which one it used at startup — `source=…` on the
      # sessions line — which is how you check.
      KENWARD_PASSPHRASE: ${KENWARD_PASSPHRASE}
      # Where this container's lore store lives. kenward opens it in process, so
      # this is the store the household actually remembers into. It must be under
      # the data volume below and it must be stated: unset, lore falls back to
      # $HOME/.lore — /home/nonroot/.lore in this image — which is on the
      # read_only root filesystem, so the store cannot be created and kenward
      # refuses to serve rather than running on with no memory. Same variable and
      # same path as every service in compose.isolated.yml, for the same reason.
      LORE_HOME: /var/lib/kenward/lore
      # Add one line here (and in .env) per api_key_env your endpoints
      # reference, e.g.:
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

    volumes:
      - ./kenward.yaml:/etc/kenward/kenward.yaml:ro,z
      - kenward-data:/var/lib/kenward

    # Declared here as well as in the image, and it is not a duplicate: the
    # image's HEALTHCHECK instruction is Docker-format only, and `podman build`
    # defaults to OCI, where it is dropped with the warning "HEALTHCHECK is not
    # supported for OCI image format and will be ignored". Podman is one of the
    # two runtimes this deployment supports, so the check that actually runs is
    # the one written here. Same command, same intervals — `doctor` exits 0 when
    # the config loads, lore answers and Telegram authorises, and deliberately
    # does NOT probe any routing endpoint: a household GPU box is legitimately
    # switched off, and treating that as unhealthy restarts a healthy container
    # in a loop.
    healthcheck:
      test: ["CMD", "/usr/local/bin/kenward", "doctor",
             "--config", "/etc/kenward/kenward.yaml",
             "--data-dir", "/var/lib/kenward"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Writable scratch space only; the data directory is the one place
      # kenward actually persists anything.
      - /tmp
    cap_drop:
      - ALL

volumes:
  kenward-data:
