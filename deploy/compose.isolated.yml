# kenward — Isolated mode (docs/README.md's "Two modes, one binary" table).
#
# One container per member, plus one for the household group — each with its
# own bot token, its own lore instance (own LORE_HOME), its own key, and its
# own data volume. No two services here may share a data volume or a
# LORE_HOME: that separation is the entire point of Isolated mode. If the
# operator running this machine can read a member's private memory anyway,
# Isolated mode has failed at its one job — use Simple mode instead and be
# honest about the trade-off rather than half-isolating.
#
# NOTE: this file is normally GENERATED — from kenward.yaml's `members:` list,
# by `kenward setup` or an operator tool built on it — not hand-maintained.
# It is written out here as a worked example for a two-member household
# (david, jordan) so the shape is clear; a comment at the bottom shows the
# block to copy when adding a third member by hand. Before hand-editing a
# generated copy, diff it against kenward.yaml — a member added to the config
# but not to this file simply has no container.
#
# Isolated mode is Linux-only (docs/IMPLEMENTATION.md §8, `supervisor/isolated`).
#
# Before running:
#   1. Write kenward.yaml next to this file (mode: isolated), with one
#      `bot_token_env` AND one `passphrase_env` per member, plus one
#      `bot_token_env` for the household group — see docs/IMPLEMENTATION.md §4.
#      Do NOT commit it. The group needs no passphrase: it serves the shared
#      space and holds no member's key.
#   2. Create a `.env` file next to this compose file (NOT committed — see
#      deploy/README.md) defining every bot token and provider key below.
#   3. Supply a `lore` binary per service (see ../Dockerfile's note) — each
#      service gets its OWN copy/mount, never a shared one, since sharing the
#      binary is fine but sharing the *instance* (same LORE_HOME) is not.
#   4. Nothing to do: each service initialises its own lore store on first
#      start, and you should NOT run `lore init` against these volumes by hand.
#
#      This step used to be an operator step, and the reason it is gone is worth
#      knowing. `lore mcp` refuses to start against an uninitialised LORE_HOME —
#      "no account at /var/lib/kenward/lore/account.json (run `lore init`)" —
#      and so does kenward: `run` completes an MCP handshake with lore before it
#      serves anything. A fresh volume is in exactly that state, so every
#      service exited 1 on first `up` until somebody ran `lore init` into it.
#      `kenward run` now does it itself, in the container, when LORE_HOME does
#      not exist or is empty, and never again after that — an existing store is
#      left alone whatever else happens. A `lore init` of your own would only
#      race it, and against a volume that already holds a store it fails.
#
#      The recovery code is DISCARDED rather than printed, deliberately: it is a
#      KDF factor for relay signup and backup, which nothing here configures,
#      and printing it would put a member's account recovery factor into
#      `docker logs`, which is yours to read and not yours to hold. If a member
#      wants one, mint it inside their own container with
#      `lore recovery new --yes-i-saved-it`; it needs no previous code.
#
#   4b. THE SHARED SPACE. Every pod resolves household.shared_space against ITS
#      OWN lore store — a member's pod reads and writes the shared space as well
#      as their private one — but three separate LORE_HOMEs are three separate
#      lore accounts with three separate id spaces, so the space one store
#      creates does not exist in the others until they are invited into it. Skip
#      this and every member's `doctor` says `space "…" is not a space this lore
#      store holds`, the household group conversation has memory in one container
#      only, and nothing else reports it. Each member's PRIVATE space is
#      unaffected either way: it lives in that member's own store, which is the
#      property this mode exists for.
#
#      Two things make it work, and kenward now supplies one of them. Inside
#      every service, `kenward run` starts lore's sync daemon (`lore serve
#      --lan`) for as long as the unit serves, so the pods find each other on the
#      compose network and converge on whatever spaces they have in common. That
#      is automatic and there is nothing to configure — no port, no peer list, no
#      address, and deliberately none: a container's address changes every time
#      it is recreated, so anything written down here would be stale by the first
#      `up`. `docker compose exec kenward-david /usr/local/bin/lore peer list`
#      shows what it has found.
#
#      The other is membership, and unlike `lore init` above it stays yours.
#      That is the line: creating an account is plumbing with no decision in it,
#      so the container does it; creating a space and handing out membership are
#      decisions. kenward never creates a lore space and never grants itself
#      membership of one; lore's own embeddable API declines to expose either,
#      because a space is made by a person who chose a name and a sharing
#      posture. Create the space once, in the household service's store:
#
#        docker compose exec --user 65532:65532 kenward-household \
#          /usr/local/bin/lore space create household
#        docker compose exec --user 65532:65532 kenward-household \
#          /usr/local/bin/lore spaces        # copy the id into kenward.yaml
#
#      then, ONCE PER MEMBER, run these two in two terminals. The first prints a
#      code and waits; the second redeems it:
#
#        docker compose exec kenward-household \
#          /usr/local/bin/lore space invite <space-id> --lan --yes
#        docker compose exec kenward-david \
#          /usr/local/bin/lore join <code> --yes
#
#      The joiner finds the inviter over mDNS on the compose network. If it
#      answers "no inviting device found via mDNS", the inviter's own output
#      prints the address to pass instead — `lore join <code> --addr <host>:<port>
#      --yes` — where <host> is the household container's address (`docker
#      compose exec kenward-household hostname -i`, or `podman inspect`).
#
#      What that grants and what it does not. The invitee's store receives the
#      household space's key and nothing else. lore begins every sync by
#      exchanging BLINDED space ids — HMAC(space_key, …) — so two stores exchange
#      a space only when both already hold its key, and a member's private space,
#      whose key was generated inside that member's own container and never left
#      it, cannot be named, requested or received by a sibling. Running a daemon
#      in every service therefore adds exactly one reachable space: the
#      household's. `kenward doctor` inside a service reports whether that space
#      is here and whether the daemon is moving anything.
#   5. Mint each member's claim code BEFORE bringing their service up:
#      `kenward invite --name Jordan --data-dir .`, run from this directory.
#
#      `--data-dir .` is not optional and not a style choice. `invite` writes to
#      `<data_dir>/invites/jordan.json`, and the data_dir kenward.yaml states is
#      `/var/lib/kenward` — the path INSIDE a container, which on the host is
#      either somebody else's directory or nothing at all. Without the override
#      the command prints a claim code, reports success, and writes the digest
#      somewhere no service below mounts; `./invites/jordan.json` never appears,
#      the mount creates a directory in its place, and jordan's pod refuses to
#      start. The code is then unusable and there is no copy of it anywhere.
#
#      It needs no secrets at all — it mints a digest, and opens no bot and
#      unwraps no key — so it will also run as `docker compose run --rm --no-deps
#      kenward-jordan invite --name Jordan`, from a service holding only its own.
#      Prefer the host anyway, and for a reason that has nothing to do with
#      secrets: a code minted inside a service lands in THAT service's named
#      volume, which no other service and no host path can mount, so it reaches
#      nobody. `--data-dir .` on the host is what puts it where the mount below
#      can find it. On an SELinux host there is a second reason, in the `z`/`Z`
#      note further down: a `compose run` against this service inherits its
#      mounts and relabels the `Z` files out from under the running container.
#
#      What that writes is the digests of jordan's outstanding codes, and nobody
#      else's — which the service below mounts read-only. This is the whole of
#      how a code minted on the host reaches the container that has to redeem
#      it: the claim happens in a conversation with the member's OWN bot
#      (D-023), against the invite store on that container's OWN data volume,
#      and nothing else crosses between the two. Skip it and the member is
#      handed a code their bot has never heard of, and enrolment answers with
#      the silence it owes a stranger.
#      Order matters for the same reason it does for kenward.yaml above: a
#      container runtime asked to bind-mount a source file that does not exist
#      creates a DIRECTORY in its place, and the container then refuses to
#      start and says so.
#
# TO REVOKE A MEMBER LATER: run `kenward revoke jordan --data-dir .` on the host —
# same directory and same override as `invite` in step 5, for the same reason and
# with the same failure if it is left out. That writes
# `<data_dir>/revocations/jordan.json`, then ADD the mount to that member's
# service — `./revocations/jordan.json:/etc/kenward/revoked.json:ro,Z` — and
# `docker compose up -d kenward-jordan`. The `--revoked=` flag is already in every
# member's `command:` below; only the mount is added, and only once there is a
# record to mount, for the missing-source-becomes-a-directory reason just above.
# This step is not optional bookkeeping: the binding is not on the host. The claim
# was redeemed inside that member's container, against the enrolment state on that
# container's own data volume, which is the same reason a claim code has to be
# carried in. Skip it and `kenward revoke` clears a host record nothing reads,
# reports a revocation, and the container carries on serving the account. Rotating
# that member's lore space key is separate and still yours: kenward has no
# authority over one and says so.
#
# EVERY BIND MOUNT BELOW CARRIES `z` OR `Z`, AND WHICH ONE IS NOT ARBITRARY.
#
# On a host running SELinux in enforcing mode — Fedora, RHEL, CentOS Stream,
# which is where rootless podman is most at home — a bind-mounted host file
# keeps its own SELinux label, and a container process (`container_t`) is not
# permitted to read it. Every read-only mount here would be denied and the
# container would exit on a permission error it could not explain. The two
# options tell the runtime to relabel the source so the container may read it:
#
#   z  relabel SHARED. Any container may read it. Used for the two files every
#      service below mounts — ./kenward.yaml and ./bin/lore.
#   Z  relabel PRIVATE to the one container. Used for the per-member files —
#      ./invites/<id>.json and ./revocations/<id>.json — which have exactly one
#      reader by design.
#
# DO NOT swap them. `Z` on a file two services share relabels it with the
# categories of whichever container was started last, and the others lose
# access — so `Z` on ./kenward.yaml would break the household one service at a
# time, in start order, with no error naming the cause. `z` on a per-member
# invite or revocation would be the smaller mistake but still the wrong one: it
# opens a file scoped to one member to every container on the host.
#
# Both are no-ops where SELinux is not enforcing — Docker Desktop, Ubuntu and
# every other AppArmor host parse the option and skip the relabel — so nothing
# here changes on those. Relabelling DOES modify the host file's SELinux label
# where it applies, which is the intended effect and worth knowing before
# pointing a mount at a file something else on the host also reads.
#
# The one trap `Z` brings, on an enforcing host: `docker compose run` against a
# member's service inherits that service's volumes, so the throwaway container
# relabels the `Z` files to ITS categories and the long-running service loses
# access to its own invites at the next start. That is the sharper form of the
# reason step 5 already gives for minting on the host instead — `kenward invite
# --name Jordan --data-dir .`, never `compose run … kenward-jordan invite`.
#
# Named volumes (kenward-*-data) need nothing: the runtime creates and labels
# those itself.
#
# NO `env_file:` ANYWHERE IN THIS FILE — do not add it back. `env_file:`
# injects the *entire* referenced file into that one container's process
# environment. A top-level `.env` next to this compose file is different: Compose
# reads it only to interpolate `${VAR}` at parse time, so a service gets
# exactly the variables its own `environment:` block names and nothing else.
# Per-member bot tokens exist so that a compromised or merely curious process
# holding one member's token cannot read another member's Telegram
# conversation. `env_file:` on every service would hand each container every
# member's token at once — David's container would hold Jordan's bot token —
# which is exactly the failure this file's header warns about. The same
# applies to provider API keys below: each service is given only the keys its
# own tier chain in kenward.yaml can actually reach, never the full set.
#
# AND IT APPLIES HARDEST TO THE PASSPHRASES. In isolated mode each member's key
# is wrapped under that member's OWN passphrase — that is what session custody
# means here, and it is why a compromise of one container cannot open another
# member's memory even with the disk in hand. One passphrase shared across the
# services would be simple mode's key custody with isolated mode's name on it,
# and nothing would ever report it: every container would unlock, every member
# would be served, and the property the mode was chosen for would be gone. One
# variable per member, one member per container, and never the same value in
# two of them.
#
# Even scoped this way, a member's own token still sits in that member's own
# container's environment — visible to anything with access to that specific
# container (a shell in it, `docker inspect`, `/proc` from inside it). That is
# a real gap compared to kenward.service's systemd credentials, which never
# touch the environment at all (see that file's comments) — containers have
# no directly equivalent primitive Compose can drive portably. If that gap
# matters for your household, kenward's config also accepts a `*_file` form
# (e.g. `bot_token_file`) pointing at a path — mount the secret in as a
# read-only, 0600 file (a Docker/Podman secret, or a bind mount) instead of
# setting it via `environment:`, and reference that path instead.

services:
  # --- per-member pod: david ---
  kenward-david:
    image: ghcr.io/blueheisenberg/kenward:latest
    container_name: kenward-david
    restart: unless-stopped
    environment:
      # Must match this member's bot_token_env in kenward.yaml. Nothing else
      # from .env reaches this container — see the note at the top of this
      # file on why `env_file:` is not used here.
      KENWARD_BOT_TOKEN_DAVID: ${KENWARD_BOT_TOKEN_DAVID}
      # The passphrase that wraps DAVID'S key and nobody else's. Must match this
      # member's `passphrase_env` in kenward.yaml, and must be a different
      # variable holding a different value from every other service here — see
      # the note at the top of this file. Without it this container starts,
      # unwraps nothing, and answers every message david sends with the locked
      # notice; kenward refuses to start instead and says which variable.
      #
      # There is no `KENWARD_PASSPHRASE` here and there must not be: that is the
      # node-wide passphrase simple mode uses, and one node passphrase across
      # these containers is one wrapping secret for every member's key.
      KENWARD_PASSPHRASE_DAVID: ${KENWARD_PASSPHRASE_DAVID}
      # Which unit this container is, stated to the container rather than only
      # to the `run` process below. `--member=david` in `command:` is what
      # `run` reads; the image's HEALTHCHECK is a *separate* process with no
      # arguments, and without this it would check the whole household — and
      # fail, because this container holds only david's token, which is the
      # entire point. Keep the two in step: the same member id in both.
      KENWARD_MEMBER: david
      # This pod's own lore instance. Distinct per service even though the
      # in-container path is the same string everywhere below — it resolves
      # against this service's own volume, never another's.
      LORE_HOME: /var/lib/kenward/lore
      # No provider API key here: in this worked example david's tiers in
      # kenward.yaml are `[local]` (local-only, refuses cloud — see
      # docs/IMPLEMENTATION.md §4/§10). A key present in the environment is a
      # key that can be used regardless of what routing policy intends, so if
      # your david's tiers ever include a cloud tier, add exactly that
      # endpoint's api_key_env here — never the whole provider-key set.
    volumes:
      - ./kenward.yaml:/etc/kenward/kenward.yaml:ro,z
      - kenward-david-data:/var/lib/kenward
      - ./bin/lore:/usr/local/bin/lore:ro,z
      # DAVID'S outstanding claim codes and nobody else's, written by
      # `kenward invite --name David` (see step 4 in the header). Hashed —
      # a record is a PBKDF2 digest of an 80-bit code, not the code — so this
      # is not a redeemable secret; it is still one member's file mounted into
      # one member's container, and never the whole `invites.json`, which holds
      # every member's. Read-only: this container imports it into the invite
      # store on its own data volume and marks codes consumed THERE. The host's
      # copy is never rewritten, which is why the import skips digests already
      # present rather than overwriting them — otherwise a spent single-use code
      # would come back redeemable on the next `up`.
      - ./invites/david.json:/etc/kenward/invites.json:ro,Z
    # `run` first, and it is not optional: the image's ENTRYPOINT is the bare
    # binary and `run` lives in its CMD, so a `command:` here REPLACES `run`
    # rather than adding to it. Without it the container exits 2 on startup with
    # `kenward: unknown command "--config=/etc/kenward/kenward.yaml"`, restarts,
    # and does that forever. Same for every service below.
    command:
      - "run"
      - "--config=/etc/kenward/kenward.yaml"
      - "--data-dir=/var/lib/kenward"
      # Where this container finds the codes mounted above. It imports them into
      # the invite store on its own volume on the way up; a path that holds no
      # file simply means no invite is outstanding. The household group's service
      # below deliberately has no such flag: D-023 puts the claim conversation on
      # the member's own bot, so the group's pod has no claimer at all.
      - "--invites=/etc/kenward/invites.json"
      # Where this container finds a revocation recorded for david. `kenward
      # revoke david` writes `<data_dir>/revocations/david.json` on the host; add
      # the matching read-only mount above when you revoke somebody and bring
      # this service back up. It is not mounted by default deliberately: almost
      # nobody is revoked, and a bind-mount of a file that does not exist yet
      # creates a DIRECTORY in its place, which this container then refuses to
      # start over. A path with no file is simply no revocation.
      #
      # This is the whole of how a revocation performed on the host reaches the
      # container that actually holds the binding. The claim was redeemed HERE,
      # against the enrolment state on this container's own data volume, and the
      # host can neither see nor write that file. Skip this and `kenward revoke`
      # empties a record on the host that nothing reads, reports a revocation,
      # and this container carries on serving the account.
      - "--revoked=/etc/kenward/revoked.json"
      - "--member=david"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  # --- per-member pod: jordan ---
  kenward-jordan:
    image: ghcr.io/blueheisenberg/kenward:latest
    container_name: kenward-jordan
    restart: unless-stopped
    environment:
      # As with david, above: only this member's own token, nothing else
      # from .env.
      KENWARD_BOT_TOKEN_JORDAN: ${KENWARD_BOT_TOKEN_JORDAN}
      # Jordan's own passphrase, a different variable holding a different value
      # from david's. See david's block above for why that is not a style
      # preference.
      KENWARD_PASSPHRASE_JORDAN: ${KENWARD_PASSPHRASE_JORDAN}
      # As with david: the unit, for the HEALTHCHECK's benefit. Must match
      # --member=jordan below.
      KENWARD_MEMBER: jordan
      LORE_HOME: /var/lib/kenward/lore
      # Worked-example difference from david: say jordan's tiers in
      # kenward.yaml DO include a cloud tier (e.g. `[local, cloud]`) backed by
      # an endpoint with `api_key_env: OPENROUTER_API_KEY`. Because jordan's
      # own chain can reach it, jordan's container — and only jordan's — gets
      # the key. `kenward run` applies the same rule to the pods it starts,
      # from the same scoping function, without anyone writing a line: it is
      # what makes a mixed tier chain runnable on that path at all. Where two
      # members' chains reach ONE endpoint they share ONE key, here and there
      # alike — it is one provider account, and the way to keep two budgets
      # apart is two endpoints with two api_key_env values.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./kenward.yaml:/etc/kenward/kenward.yaml:ro,z
      - kenward-jordan-data:/var/lib/kenward
      - ./bin/lore:/usr/local/bin/lore:ro,z
      # As with david, above: jordan's own file, never the shared invites.json.
      - ./invites/jordan.json:/etc/kenward/invites.json:ro,Z
    command:
      - "run"
      - "--config=/etc/kenward/kenward.yaml"
      - "--data-dir=/var/lib/kenward"
      - "--invites=/etc/kenward/invites.json"
      # As with david, above: where a revocation recorded on the host is read
      # from, with the mount added only when there is one.
      - "--revoked=/etc/kenward/revoked.json"
      - "--member=jordan"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  # --- household group pod (shared space; never touches a private space) ---
  kenward-household:
    image: ghcr.io/blueheisenberg/kenward:latest
    container_name: kenward-household
    restart: unless-stopped
    environment:
      # The group's own token, nothing else from .env. Note what is NOT here: no
      # passphrase of any kind. This pod serves the shared space and holds no
      # member's key, so a passphrase here would unwrap nothing — and a secret
      # that opens a member's memory, sitting in the one container every member
      # talks to, is precisely what isolated mode exists to keep out of it.
      KENWARD_BOT_TOKEN_HOUSEHOLD: ${KENWARD_BOT_TOKEN_HOUSEHOLD}
      # The group pod's unit, for the HEALTHCHECK. "1" is the only true value;
      # must match the `--group` in command: below.
      KENWARD_GROUP: "1"
      LORE_HOME: /var/lib/kenward/lore
      # Add only the api_key_env values named by endpoints tagged with a tier
      # in household.tiers (kenward.yaml). If household.tiers includes
      # `cloud` the same way jordan's does above:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./kenward.yaml:/etc/kenward/kenward.yaml:ro,z
      - kenward-household-data:/var/lib/kenward
      - ./bin/lore:/usr/local/bin/lore:ro,z
    command:
      - "run"
      - "--config=/etc/kenward/kenward.yaml"
      - "--data-dir=/var/lib/kenward"
      - "--group"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  # --- to add a third member (e.g. "sam") ---
  # 1. Copy one of the per-member blocks above (david or jordan).
  # 2. Rename the service key, container_name, and both volume references to
  #    kenward-sam / kenward-sam-data.
  # 3. Set --member=sam in `command:`, set KENWARD_MEMBER: sam in
  #    `environment:` (the HEALTHCHECK reads that one — see david's block), and
  #    swap the token line for KENWARD_BOT_TOKEN_SAM (add it to kenward.yaml's
  #    members[].bot_token_env and to .env — never reuse another member's token
  #    variable). If the two disagree, kenward refuses to start and says so
  #    rather than quietly serving the wrong member.
  # 3c. Run `kenward invite --name Sam --data-dir .` on the host BEFORE `up` (the
  #    override is required — see step 5 in the header), initialise sam's own lore
  #    store the same way step 4 does, join it to the household space the way step
  #    4b does — a member's pod that never joins reads no household memory and
  #    writes none — and mount the file invite writes:
  #    `./invites/sam.json:/etc/kenward/invites.json:ro,Z` — `Z`, not `z`, for
  #    the reason in the header: this file has exactly one reader. Sam's
  #    own file — never david's, never the shared `invites.json`. Without it
  #    sam's container comes up claim-only and refuses the code sam was handed,
  #    in silence, which is the one enrolment failure nobody can diagnose from
  #    the chat. Keep `--revoked=/etc/kenward/revoked.json` in the copied
  #    `command:` too; its mount is added later and only if sam is ever revoked
  #    (see "TO REVOKE A MEMBER LATER" in the header).
  # 3b. Do the same for the passphrase: KENWARD_PASSPHRASE_SAM here, sam's
  #    `passphrase_env` in kenward.yaml, and a value of its own in .env. Never
  #    reuse david's or jordan's — kenward refuses a file where two members name
  #    one passphrase source, but it cannot see two variables set to the same
  #    string, and that is the same loss wearing a disguise.
  # 4. Add a `kenward-sam-data:` entry under `volumes:` below.
  # 5. Do NOT point sam's LORE_HOME or data volume at david's or jordan's —
  #    each member's lore instance must be exclusive to their own container.
  # 6. Do NOT add `env_file:` and do NOT copy jordan's OPENROUTER_API_KEY line
  #    by reflex — only add a provider key here if sam's own tiers in
  #    kenward.yaml actually include the tier that key's endpoint is tagged
  #    with. A local-only sam gets no provider key at all, same as david.

volumes:
  kenward-david-data:
  kenward-jordan-data:
  kenward-household-data:
