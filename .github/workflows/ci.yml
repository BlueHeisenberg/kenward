name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Builds every command, which on macOS is also the cgo build of
      # cmd/kenward-desktop — the one target that cannot be cross-compiled and
      # so has nowhere else to be checked before a release runs.
      - name: Build
        run: go build ./...

      # The daemon has to keep linking without cgo: the distroless image has no
      # libc, and cmd/kenward-desktop's tray library needs cgo on macOS. One
      # import reaching from the daemon into anything cgo-touching would break
      # the container image without breaking a single test, and the release
      # gate would be the first thing to notice — after a tag exists.
      - name: The daemon builds without cgo
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/kenward-nocgo" ./cmd/kenward

      - name: Test (race)
        run: go test -race ./...
