name: Release

# Cutting a release is `git tag -a vX.Y.Z && git push origin vX.Y.Z`. This
# workflow does everything after that except the one thing it must never do:
# sign. The release signing key is the root of trust for every installation,
# and a CI system that can sign is a CI system that can push code to every
# household — docs/RELEASING.md, "The signing key".
#
# So the GitHub release this creates is a DRAFT. The maintainer signs the
# manifest on the machine holding the key, attaches manifest.json, and
# publishes. Until then no household sees anything: `kenward update` reads
# .../releases/latest/download/manifest.json, and "latest" skips drafts.

on:
  push:
    tags: ['v*']
  # For rehearsing the build without a tag: produces artifacts, publishes
  # nothing, uploads the snapshot for inspection.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same gate CI runs on every push, on the exact commit being released.
  # A tag can point at anything, including a commit that never went through a
  # pull request.
  gate:
    name: gate
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  artifacts:
    name: artifacts
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release and upload to it
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version and the changelog from tag history;
          # a shallow clone gives it neither.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Build and draft the release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: >-
            ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: off
          # The PUBLIC half of the release signing key, base64,
          # comma-separated — a repository *variable*, not a secret, because
          # it is compiled into every published binary anyway. Unset means the
          # build cannot self-update and says so when asked.
          KENWARD_RELEASE_KEYS: ${{ vars.KENWARD_RELEASE_KEYS }}
          # Both default to "no tap" until BlueHeisenberg/homebrew-tap exists.
          HOMEBREW_TAP_SKIP: ${{ vars.HOMEBREW_TAP_SKIP || 'true' }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Keep the snapshot for inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            dist/kenward_*
            dist/checksums.txt
          retention-days: 7

  image:
    name: image
    needs: gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Built from the repository's own Dockerfile rather than through
      # GoReleaser's docker support: that would need a second Dockerfile that
      # copies a prebuilt binary, and the one in this repository carries a
      # page of documentation about why lore is not in the image. Two would
      # drift.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # type=ref,event=tag keeps the tag verbatim, leading "v" and all. That
      # matters: an isolated-mode host supervisor starts pods from
      # ghcr.io/blueheisenberg/kenward:<version.Short()>, and version.Short()
      # is the git tag as written (cmd/kenward/supervisors.go). Strip the "v"
      # and every isolated household pulls a tag that does not exist.
      #
      # :latest moves only for a real release — a prerelease tag carries a
      # hyphen (v0.2.0-rc1) — because deploy/compose.*.yml pin :latest.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/blueheisenberg/kenward
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Commit date
        id: commit
        run: echo "date=$(git show -s --format=%cI ${{ github.sha }})" >>"$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.commit.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
